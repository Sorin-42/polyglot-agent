# Builds the standalone PolyglotAgent.exe on a Windows runner.
# Push this folder to a GitHub repo, then: Actions -> build-exe -> Run workflow,
# and download the "PolyglotAgent" artifact.
name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
        continue-on-error: true
      - run: python -m PyInstaller --noconfirm --clean PolyglotAgent.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PolyglotAgent
          path: dist/PolyglotAgent.exe
